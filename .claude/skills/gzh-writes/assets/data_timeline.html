<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #F2F2F2;
    --green: #B8D8BE;
    --pink: #E91E63;
    --yellow: #FFF200;
    --ink: #2D2926;
    --ink-light: #5C5350;
    --white: #FFFFFF;
    --serif: Georgia, 'Noto Serif SC', 'PingFang SC', serif;
    --sans: 'PingFang SC', 'Noto Sans SC', -apple-system, system-ui, sans-serif;
    --mono: 'SF Mono', 'Menlo', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; background: var(--bg); }

  .page {
    width: 1080px;
    background: var(--bg);
    position: relative;
    padding: 60px;
  }

  .page > .grain {
    position: absolute;
    inset: 0;
    filter: url(#noise);
    opacity: 0.04;
    pointer-events: none;
    z-index: 100;
  }

  mark { background: rgba(255,242,0,0.45); color: inherit; padding: 4px 8px; }

  /* 时间轴布局 */
  .timeline-title {
    font: 700 36px/1.3 var(--serif);
    color: var(--ink);
    text-align: center;
    margin-bottom: 40px;
  }

  .timeline {
    position: relative;
    padding-left: 60px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 24px;
    top: 0;
    bottom: 0;
    width: 3px;
    background: linear-gradient(to bottom, var(--pink), var(--ink-light));
    border-radius: 2px;
  }

  .timeline-node {
    position: relative;
    margin-bottom: 36px;
  }

  .timeline-node:last-child {
    margin-bottom: 0;
  }

  .timeline-node::before {
    content: '';
    position: absolute;
    left: -48px;
    top: 8px;
    width: 14px;
    height: 14px;
    background: var(--white);
    border: 3px solid var(--pink);
    border-radius: 50%;
    z-index: 2;
  }

  .timeline-node.muted::before {
    border-color: var(--ink-light);
  }

  .timeline-date {
    font: 700 14px/1 var(--mono);
    color: var(--pink);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  .timeline-node.muted .timeline-date {
    color: var(--ink-light);
  }

  .timeline-card {
    background: var(--white);
    border-radius: 12px;
    padding: 24px 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .timeline-card h3 {
    font: 700 20px/1.4 var(--serif);
    color: var(--ink);
    margin-bottom: 8px;
  }

  .timeline-card p {
    font: 400 15px/1.8 var(--sans);
    color: var(--ink-light);
  }

  .timeline-card .highlight {
    color: var(--pink);
    font-weight: 700;
  }

  .timeline-footer {
    text-align: center;
    margin-top: 32px;
    font: 400 14px/1.6 var(--sans);
    color: var(--ink-light);
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</svg>
<div class="page">
  <div class="grain"></div>

  <h2 class="timeline-title">{{TIMELINE_TITLE}}</h2>

  <div class="timeline">
    {{TIMELINE_NODES}}
    <!-- 每个节点格式：
    <div class="timeline-node">
      <span class="timeline-date">{{DATE}}</span>
      <div class="timeline-card">
        <h3>{{EVENT_TITLE}}</h3>
        <p>{{EVENT_DESC}}</p>
      </div>
    </div>
    添加 class="muted" 到 timeline-node 可降低视觉权重
    -->
  </div>

  <p class="timeline-footer">{{FOOTER_TEXT}}</p>
</div>
</body>
</html>
