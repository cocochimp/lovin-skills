<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #F2F2F2;
    --green: #B8D8BE;
    --pink: #E91E63;
    --yellow: #FFF200;
    --ink: #2D2926;
    --ink-light: #5C5350;
    --white: #FFFFFF;
    --serif: Georgia, 'Noto Serif SC', 'PingFang SC', serif;
    --sans: 'PingFang SC', 'Noto Sans SC', -apple-system, system-ui, sans-serif;
    --mono: 'SF Mono', 'Menlo', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; background: var(--bg); }

  .page {
    width: 1080px;
    background: var(--bg);
    position: relative;
    padding: 60px;
  }

  .page > .grain {
    position: absolute;
    inset: 0;
    filter: url(#noise);
    opacity: 0.04;
    pointer-events: none;
    z-index: 100;
  }

  mark { background: rgba(255,242,0,0.45); color: inherit; padding: 4px 8px; }

  /* 数据表格布局 */
  .table-title {
    font: 700 36px/1.3 var(--serif);
    color: var(--ink);
    text-align: center;
    margin-bottom: 12px;
  }

  .table-subtitle {
    font: 400 16px/1.6 var(--sans);
    color: var(--ink-light);
    text-align: center;
    margin-bottom: 36px;
  }

  .data-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--white);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .data-table thead th {
    font: 700 15px/1.4 var(--sans);
    color: var(--white);
    background: var(--ink);
    padding: 16px 20px;
    text-align: left;
    letter-spacing: 0.5px;
  }

  .data-table tbody td {
    font: 400 15px/1.6 var(--sans);
    color: var(--ink);
    padding: 14px 20px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }

  .data-table tbody tr:last-child td {
    border-bottom: none;
  }

  .data-table tbody tr:hover {
    background: rgba(0,0,0,0.02);
  }

  .data-table .highlight {
    color: var(--pink);
    font-weight: 700;
  }

  .data-table .tag {
    display: inline-block;
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 10px;
    font-weight: 600;
  }

  .data-table .tag-up {
    background: rgba(76,175,80,0.12);
    color: #2e7d32;
  }

  .data-table .tag-down {
    background: rgba(233,30,99,0.12);
    color: var(--pink);
  }

  .table-footer {
    text-align: center;
    margin-top: 24px;
    font: 400 14px/1.6 var(--sans);
    color: var(--ink-light);
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</svg>
<div class="page">
  <div class="grain"></div>

  <h2 class="table-title">{{TABLE_TITLE}}</h2>
  <p class="table-subtitle">{{TABLE_SUBTITLE}}</p>

  <table class="data-table">
    <thead>
      <tr>
        {{THEAD_CELLS}}
        <!-- 格式：<th>列标题</th> -->
      </tr>
    </thead>
    <tbody>
      {{TBODY_ROWS}}
      <!-- 每行格式：
      <tr>
        <td>内容</td>
        <td class="highlight">高亮数值</td>
        <td><span class="tag tag-up">↑ 12%</span></td>
      </tr>
      -->
    </tbody>
  </table>

  <p class="table-footer">{{FOOTER_TEXT}}</p>
</div>
</body>
</html>
