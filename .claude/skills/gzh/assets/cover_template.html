<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap');

  :root {
    --bg: #1A1A2E;
    --accent: #E94560;
    --ink: #FFFFFF;
    --ink-light: rgba(255,255,255,0.7);
    --serif: 'DM Serif Display', 'KingHwa_OldSong', Georgia, 'Noto Serif SC', serif;
    --sans: 'DM Sans', 'KingHwa_OldSong', -apple-system, 'PingFang SC', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 608px; overflow: hidden; }

  .cover {
    width: 1080px;
    height: 608px;
    background: var(--bg);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 80px;
  }

  .cover > .grain {
    position: absolute;
    inset: 0;
    filter: url(#noise);
    opacity: 0.05;
    pointer-events: none;
    z-index: 10;
  }

  .cover > .accent-bar {
    position: absolute;
    left: 0;
    top: 0;
    width: 8px;
    height: 100%;
    background: var(--accent);
  }

  .title {
    font: 700 64px/1.2 var(--serif);
    color: var(--ink);
    margin-bottom: 24px;
    max-width: 860px;
    position: relative;
    z-index: 5;
  }

  .subtitle {
    font: 400 28px/1.5 var(--sans);
    color: var(--ink-light);
    max-width: 700px;
    position: relative;
    z-index: 5;
  }

  {{CUSTOM_CSS}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</svg>
<div class="cover">
  <div class="grain"></div>
  <div class="accent-bar"></div>
  {{TITLE_HTML}}
  <div class="subtitle">{{SUBTITLE}}</div>
</div>
</body>
</html>
