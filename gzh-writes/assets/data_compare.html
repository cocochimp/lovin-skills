<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #F2F2F2;
    --green: #B8D8BE;
    --pink: #E91E63;
    --yellow: #FFF200;
    --ink: #2D2926;
    --ink-light: #5C5350;
    --white: #FFFFFF;
    --serif: Georgia, 'Noto Serif SC', 'PingFang SC', serif;
    --sans: 'PingFang SC', 'Noto Sans SC', -apple-system, system-ui, sans-serif;
    --mono: 'SF Mono', 'Menlo', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; background: var(--bg); }

  .page {
    width: 1080px;
    background: var(--bg);
    position: relative;
    padding: 60px;
  }

  .page > .grain {
    position: absolute;
    inset: 0;
    filter: url(#noise);
    opacity: 0.04;
    pointer-events: none;
    z-index: 100;
  }

  mark { background: rgba(255,242,0,0.45); color: inherit; padding: 4px 8px; }

  /* 对比卡片布局 */
  .compare-title {
    font: 700 36px/1.3 var(--serif);
    color: var(--ink);
    text-align: center;
    margin-bottom: 40px;
  }

  .compare-container {
    display: flex;
    gap: 32px;
    justify-content: center;
  }

  .compare-card {
    flex: 1;
    background: var(--white);
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    position: relative;
  }

  .compare-card .card-label {
    font: 700 14px/1 var(--sans);
    color: var(--white);
    background: var(--ink);
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  .compare-card.accent .card-label {
    background: var(--pink);
  }

  .compare-card .card-heading {
    font: 700 24px/1.4 var(--serif);
    color: var(--ink);
    margin-bottom: 16px;
  }

  .compare-card .card-item {
    font: 400 16px/2 var(--sans);
    color: var(--ink-light);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    padding: 8px 0;
  }

  .compare-card .card-item:last-child {
    border-bottom: none;
  }

  .compare-card .card-item .value {
    font-weight: 700;
    color: var(--ink);
  }

  .compare-card.accent .card-item .value {
    color: var(--pink);
  }

  .compare-footer {
    text-align: center;
    margin-top: 32px;
    font: 400 14px/1.6 var(--sans);
    color: var(--ink-light);
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</svg>
<div class="page">
  <div class="grain"></div>

  <h2 class="compare-title">{{COMPARE_TITLE}}</h2>

  <div class="compare-container">
    <div class="compare-card">
      <span class="card-label">{{LEFT_LABEL}}</span>
      <h3 class="card-heading">{{LEFT_HEADING}}</h3>
      {{LEFT_ITEMS}}
      <!-- 每项格式：<div class="card-item">指标名 <span class="value">数值</span></div> -->
    </div>

    <div class="compare-card accent">
      <span class="card-label">{{RIGHT_LABEL}}</span>
      <h3 class="card-heading">{{RIGHT_HEADING}}</h3>
      {{RIGHT_ITEMS}}
    </div>
  </div>

  <p class="compare-footer">{{FOOTER_TEXT}}</p>
</div>
</body>
</html>
