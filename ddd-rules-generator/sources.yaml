# 语雀 DDD 文档源配置
# topic 决定输出文件名：.claude/rules/ddd-{topic}.md

sources:
  - url: "https://aliyuque.antfin.com/fliggy-flight/flightsaas/hhhmyshb8ud2vw0q"
    topic: "handbook"
    globs:
      - "src/**/*.java"

  - url: "https://aliyuque.antfin.com/fliggy-flight/flightsaas/pfm4axvoqzofn13r"
    topic: "model-layer"
    globs:
      - "src/**/model/**/*.java"
      - "src/**/entity/**/*.java"
      - "src/**/valueobject/**/*.java"

  - url: "https://aliyuque.antfin.com/fliggy-flight/flightsaas/hh59bpw9m1i210um"
    topic: "domain-layer"
    globs:
      - "src/**/domain/**/*.java"

  - url: "https://aliyuque.antfin.com/fliggy-flight/flightsaas/ztqfcugef8ska5xq"
    topic: "application-layer"
    globs:
      - "src/**/application/**/*.java"
      - "src/**/app/**/*.java"

  - url: "https://aliyuque.antfin.com/fliggy-flight/flightsaas/wh4gwuglql04go8b"
    topic: "infrastructure-layer"
    globs:
      - "src/**/infrastructure/**/*.java"
      - "src/**/infra/**/*.java"

  - url: "https://aliyuque.antfin.com/fliggy-flight/flightsaas/qq3s2rn5f8culw60"
    topic: "client-layer"
    globs:
      - "src/**/client/**/*.java"
      - "src/**/api/**/*.java"

  - url: "https://aliyuque.antfin.com/fliggy-flight/flightsaas/lgelqggoztdff6os"
    topic: "adaptor-layer"
    globs:
      - "src/**/adaptor/**/*.java"
      - "src/**/adapter/**/*.java"
      - "src/**/controller/**/*.java"

  - url: "https://aliyuque.antfin.com/fliggy-flight/flightsaas/cm8yzu4wx1qgw3s6"
    topic: "general-dev-standards"
    globs:
      - "src/**/*.java"
